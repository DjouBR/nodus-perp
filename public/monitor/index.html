<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NODUS — Monitor de Frequência Cardíaca</title>

<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
<link rel="stylesheet" href="/css/all.css">

<style>
.w3-preto-verde { color: #000 !important; background-color: #1aff15 !important }
.w3-verde-preto { color: #1aff15 !important; background-color: #000 !important }
.w3-texto-vermelho { color: #a20025 }
.w3-negrito { font-weight: bold !important; }
.w3-negrito-extra { font-weight: 900; }

/* Tela de TV: sem margem e sem rolagem */
html, body { padding: 0; margin: 0; height: 100%; overflow: hidden; }

/* ── Animações dos ícones ── */
.fa-heart-pulse, .fa-heartbeat, .fa-percent {
  animation: heartbeat 1.5s ease-in-out infinite;
}
@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  10%, 30%  { transform: scale(1.1); }
  20%, 40%  { transform: scale(1); }
}
.fa-fire { animation: wobble 0.5s infinite; transform-origin: bottom center; }
@keyframes wobble {
  0%, 100% { transform: rotate(0deg); }
  25%       { transform: rotate(-3deg); }
  50%       { transform: rotate(0deg); }
  75%       { transform: rotate(3deg); }
}
.fa-signal-stream-slash, .fa-signal-stream { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.5; }
}

/* ── Estrutura da tela ── */
#gridContainer { display: block; position: relative; width: 100%; margin: 0; padding: 0; }
#mainHeader { margin: 0; }

/* Área dos cards: CSS Grid com colunas/linhas definidas por JS conforme o nº de atletas */
#cardsArea {
  display: grid;
  box-sizing: border-box;
  width: 100%;
  overflow: hidden;
}

.card-wrapper {
  box-sizing: border-box;
  display: block;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border-radius: 8px;
  transition: background-color 1.5s ease-in-out;
}

/* Cabeçalho do card: nome à esquerda, calorias à direita, sempre em UMA linha */
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  white-space: nowrap;
}
.card-head .card-name { min-width: 0; overflow: hidden; }
.card-head .card-cal  { flex: none; float: none !important; display: flex; align-items: center; gap: 6px; }

/* ── Gráfico circular ── */
.flex-wrapper {
  display: flex;
  flex-flow: row nowrap;
  justify-content: center;
  align-items: center;
  gap: 20px;
}
.single-chart {
  width: 88%;
  text-align: center;
  padding: 10px;
  border-radius: 10px;
  transition: background-color 1.5s ease-in-out;
}
.circular-chart { display: block; margin: 10px auto; max-width: 100%; }
.circle-bg { fill: none; stroke: transparent; stroke-width: 3.8; transition: stroke 1.5s ease-in-out; }
.circle {
  fill: none;
  stroke-width: 4;
  stroke-linecap: round;
  stroke: #000;
  transition: stroke-dasharray 1.5s ease-in-out, stroke 1.5s ease-in-out;
}
.circle-progress {
  fill: none;
  stroke-width: 3;
  stroke-linecap: round;
  transition: stroke-dasharray 1.5s ease-in-out, stroke 1.5s ease-in-out;
}
.percentage { fill: #000; font-family: sans-serif; font-size: 1em; text-anchor: middle; }
.simbolo    { fill: #000; font-family: sans-serif; font-size: 0.4em; text-anchor: middle; }

#waitingMsg {
  grid-column: 1 / -1;
  width: 100%;
  text-align: center;
  padding: 80px 20px;
  font-family: sans-serif;
  font-size: 2rem;
  font-weight: 700;
  color: #555;
}

/* ── Sessão encerrada ── */
#session-ended-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  color: #fff;
  font-size: 3rem;
  font-weight: 900;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  text-align: center;
}

/* ── Sessão em breve ── */
#session-soon-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: #0a0a0a;
  color: #fff;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  text-align: center;
  gap: 20px;
  font-family: sans-serif;
}
#soon-countdown {
  font-size: 6rem;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  color: #1aff15;
  letter-spacing: 0.05em;
  line-height: 1;
}
#soon-session-name {
  font-size: 2.2rem;
  font-weight: 900;
  color: #fff;
}
@keyframes dumbbell-pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50%       { transform: scale(1.08); opacity: 0.85; }
}
#soon-icon {
  font-size: 5rem;
  color: #1aff15;
  animation: dumbbell-pulse 2s ease-in-out infinite;
}
</style>
</head>
<body>

<!-- Overlay: sessão encerrada (token revogado) -->
<div id="session-ended-overlay">
  <div>
    <i class="fa-solid fa-flag-checkered" style="font-size:5rem;margin-bottom:1rem;"></i><br>
    Sessão Encerrada
  </div>
</div>

<!-- Overlay: sessão em breve (status scheduled/pending) -->
<div id="session-soon-overlay">
  <i id="soon-icon" class="fa-solid fa-dumbbell"></i>
  <div id="soon-session-name">—</div>
  <div style="font-size:1.1rem;color:#aaa;">A sessão começa em</div>
  <div id="soon-countdown">00:00:00</div>
  <div style="font-size:0.9rem;color:#555;margin-top:4px;">Esta tela atualizará automaticamente quando a sessão iniciar</div>
</div>

<div id="gridContainer">
  <div id="mainHeader" class="w3-bar" style="height:40px; width:100%; background-color:#f1f1f1; border-bottom:1px solid #ccc; padding:0">
    <div class="w3-bar-item w3-left" style="display:flex; align-items:center;">
      <i class="fas fa-heartbeat w3-xxlarge w3-top w3-left" style="cursor:pointer;"></i>
      <div style="margin-left:45px;">NODUS — <span id="sessionNameHeader">MONITOR DE FREQUÊNCIA CARDÍACA</span></div>
    </div>
    <div id="headerConnectionArea">
      <div id="connectedTemplate" class="w3-bar-item w3-right w3-text-green" style="display:none;">
        <i class="fa-solid fa-signal-stream"></i> Conectado
      </div>
      <div id="disconnectedTemplate" class="w3-bar-item w3-right w3-text-red" style="display:none;">
        <i class="fa-solid fa-signal-stream-slash"></i> Desconectado
      </div>
    </div>
    <div class="w3-bar-item w3-right w3-text-black"><i class="fa-solid fa-expand w3-xlarge"></i></div>
    <div class="w3-bar-item w3-right" style="display:flex;align-items:center;gap:8px;">
      <i class="fa-regular fa-stopwatch w3-xlarge"></i>
      <span class="w3-large w3-negrito" id="sessionTimer">00:00:00</span>
    </div>
  </div>
  <div id="cardsArea">
    <div id="waitingMsg">Aguardando dados dos atletas…</div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
// CONFIGURAÇÃO — lida da URL: /monitor/[token]
// ══════════════════════════════════════════════════════════════

function getTokenFromUrl() {
  const parts = window.location.pathname.split('/').filter(Boolean)
  if (parts.length >= 2 && parts[0] === 'monitor') {
    const candidate = parts[1]
    if (candidate && !candidate.includes('.')) return candidate
  }
  const qs = new URLSearchParams(window.location.search).get('token')
  if (qs && !qs.includes('.')) return qs
  return null
}

const PAGE_TOKEN = getTokenFromUrl()
let SESSION_ID   = null
let SESSION_NAME = null
let ANT_PORT     = '3001'
let timerInterval = null
let sessionStartTime = null
let countdownInterval = null

// Flag: garante que o polling de "sessão em breve" só seja criado uma vez
let soonPollingStarted = false
// Flag: bloqueia showSessionEnded/showDisconnected enquanto overlay "em breve" estiver ativo
let sessionSoonActive = false

// Máximo de caracteres do nome do atleta no card (evita quebra do cabeçalho em 2 linhas)
const MAX_NAME_CHARS = 16

// ══════════════════════════════════════════════════════════════
const COLOR_MAPPING_OPACITY = {
  'w3-grey':        'rgba(97, 97, 97, 0.7)',
  'w3-light-green': 'rgba(139, 195, 74, 0.7)',
  'w3-cyan':        'rgba(0, 188, 212, 0.7)',
  'w3-yellow':      'rgba(255, 235, 59, 0.7)',
  'w3-orange':      'rgba(255, 152, 0, 0.7)',
  'w3-red':         'rgba(244, 67, 54, 0.7)',
}
const ZONE_TO_COLOR_CLASS = {
  1: 'w3-light-green',
  2: 'w3-cyan',
  3: 'w3-yellow',
  4: 'w3-orange',
  5: 'w3-red',
}
const ZONE_STROKE = {
  1: '#8bc34a',
  2: '#00bcd4',
  3: '#ffeb3b',
  4: '#ff9800',
  5: '#f44336',
}
// Pontos por minuto em cada zona (mesma fórmula do plano de desenvolvimento)
const ZONE_WEIGHT = { 1: 1.0, 2: 1.5, 3: 2.5, 4: 4.0, 5: 3.0 }

// ══════════════════════════════════════════════════════════════
// TEMPLATES DOS CARDS (9 layouts, gerados por função)
// ══════════════════════════════════════════════════════════════
const FIRE_STYLE = '--fa-primary-color:#ff9500;--fa-secondary-color:#ff0000;--fa-secondary-opacity:1;'
const COINS_STYLE = '--fa-primary-color:#b89105;--fa-secondary-color:#686868;--fa-secondary-opacity:1;--fa-animation-duration:2s;'
const PATH_D = 'M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831'

function buildTemplate(o) {
  const px = o.px ? `font-size:${o.px}px;` : ''
  const bodyCls = o.bodyCls || ''
  const leftCls = o.leftCls || ''
  const sideStyle = o.sideStyle ? ` style="${o.sideStyle}"` : ''
  const coinsExtra = o.coinsExtra || ''
  const chartStyle = o.chartWidth ? ` style="width:${o.chartWidth}"` : ''
  return `
    <header class="card-head w3-container ${o.hdrMargin ? 'w3-margin-bottom ' : ''}w3-verde-preto ${o.hdrRound || 'w3-round-large'}">
      <span class="${o.nameCls} w3-negrito card-name"><span data-name></span></span>
      <div class="w3-right card-cal">
        <i class="fa-duotone fa-solid fa-fire ${o.calIconCls}" style="${FIRE_STYLE}"></i>
        <span class="${o.calTxtCls} w3-negrito"><span data-calories></span></span>
      </div>
    </header>
    <div class="w3-container">
      <div class="w3-half w3-center ${leftCls}"${sideStyle}>
        <div class="w3-center w3-row-padding">
          <i class="fa-duotone ${o.heartStyle} fa-heart-pulse w3-col l4 ${bodyCls}" style="--fa-primary-color:#050505;--fa-secondary-color:#f01505;--fa-secondary-opacity:1;${px}padding-top:0.3em"></i>
          <div class="w3-negrito-extra w3-col l8 ${bodyCls}"${px ? ` style="${px}"` : ''}><span data-hr></span></div>
        </div>
        <div class="w3-center w3-row-padding">
          <i class="fa-duotone fa-solid fa-fire w3-col l4 ${bodyCls}" style="${FIRE_STYLE}${px}padding-top:0.3em;"></i>
          <div class="w3-negrito-extra w3-col l8 ${bodyCls}"${px ? ` style="${px}"` : ''}><span data-calories2></span></div>
        </div>
        <div class="w3-center w3-row-padding">
          <i class="fa-duotone fa-thin fa-coins fa-beat-fade w3-col l4 ${bodyCls}" style="${COINS_STYLE}${coinsExtra}${px}padding-top:0.3em;"></i>
          <div class="w3-negrito-extra w3-col l8 ${bodyCls}"${px ? ` style="${px}"` : ''}><span data-points></span></div>
        </div>
      </div>
      <div class="w3-half w3-center"${sideStyle}>
        <div class="flex-wrapper">
          <div class="single-chart"${chartStyle}>
            <svg viewBox="0 0 36 36" class="circular-chart">
              <path class="circle-bg" d="${PATH_D}"/>
              <path class="circle" stroke-dasharray="0,100" d="${PATH_D}"/>
              <path class="circle-progress" stroke-dasharray="0,100" d="${PATH_D}"/>
              <text x="18" y="21.35" class="percentage w3-negrito" data-percent>0</text>
              <text x="18" y="27.35" class="simbolo w3-negrito">%</text>
            </svg>
          </div>
        </div>
      </div>
    </div>`
}

const CARD_TEMPLATES = {
  '01_01': buildTemplate({ nameCls: 'w3-jumbo', calIconCls: 'w3-jumbo', calTxtCls: 'w3-jumbo', hdrMargin: true, heartStyle: 'fa-solid', px: 144, coinsExtra: '--fa-beat-fade-opacity:0.9;--fa-beat-fade-scale:1.075;' }),
  '02_02': buildTemplate({ nameCls: 'w3-jumbo', calIconCls: 'w3-jumbo', calTxtCls: 'w3-jumbo', hdrMargin: true, heartStyle: 'fa-thin', px: 96, sideStyle: 'margin-top:64px;' }),
  '03_04': buildTemplate({ nameCls: 'w3-jumbo', calIconCls: 'w3-jumbo', calTxtCls: 'w3-jumbo', hdrMargin: true, heartStyle: 'fa-thin', bodyCls: 'w3-jumbo', chartWidth: '73%' }),
  '05_06': buildTemplate({ nameCls: 'w3-xxlarge', calIconCls: 'w3-xxxlarge', calTxtCls: 'w3-xxlarge', hdrMargin: true, heartStyle: 'fa-thin', bodyCls: 'w3-jumbo', chartWidth: '100%' }),
  '07_09': buildTemplate({ nameCls: 'w3-xxlarge', calIconCls: 'w3-xxxlarge', calTxtCls: 'w3-xxlarge', hdrMargin: true, heartStyle: 'fa-thin', bodyCls: 'w3-xxlarge', chartWidth: '72%' }),
  '10_12': buildTemplate({ nameCls: 'w3-xlarge', calIconCls: 'w3-xxlarge', calTxtCls: 'w3-xlarge', hdrMargin: true, heartStyle: 'fa-thin', bodyCls: 'w3-xxlarge', chartWidth: '100%' }),
  '13_16': buildTemplate({ nameCls: 'w3-xlarge', calIconCls: 'w3-xxlarge', calTxtCls: 'w3-xlarge', heartStyle: 'fa-thin', bodyCls: 'w3-xlarge', leftCls: 'w3-margin-top', chartWidth: '78%' }),
  '17_20': buildTemplate({ nameCls: 'w3-large', calIconCls: 'w3-xlarge', calTxtCls: 'w3-large', heartStyle: 'fa-thin', bodyCls: 'w3-xlarge', leftCls: 'w3-margin-top', chartWidth: '100%' }),
  '21_42': buildTemplate({ nameCls: 'w3-large', calIconCls: 'w3-xlarge', calTxtCls: 'w3-large', hdrRound: 'w3-round', heartStyle: 'fa-thin', bodyCls: 'w3-xlarge', chartWidth: '80%' }),
}

function getGridConfig(n) {
  if (n === 1)  return { colunas: 1, linhas: 1, gap: 34, templateKey: '01_01' }
  if (n === 2)  return { colunas: 2, linhas: 1, gap: 32, templateKey: '02_02' }
  if (n <= 4)   return { colunas: 2, linhas: 2, gap: 30, templateKey: '03_04' }
  if (n <= 6)   return { colunas: 3, linhas: 2, gap: 28, templateKey: '05_06' }
  if (n <= 9)   return { colunas: 3, linhas: 3, gap: 26, templateKey: '07_09' }
  if (n <= 12)  return { colunas: 4, linhas: 3, gap: 24, templateKey: '10_12' }
  if (n <= 16)  return { colunas: 4, linhas: 4, gap: 22, templateKey: '13_16' }
  if (n <= 20)  return { colunas: 5, linhas: 4, gap: 20, templateKey: '17_20' }
  if (n <= 25)  return { colunas: 5, linhas: 5, gap: 18, templateKey: '21_42' }
  if (n <= 30)  return { colunas: 6, linhas: 5, gap: 16, templateKey: '21_42' }
  if (n <= 36)  return { colunas: 6, linhas: 6, gap: 14, templateKey: '21_42' }
  return         { colunas: 7, linhas: 6, gap: 12, templateKey: '21_42' }
}

// Limita o nome a MAX_NAME_CHARS caracteres (evita quebra em 2 linhas)
function shortName(name) {
  const s = String(name || '—').trim()
  const chars = Array.from(s)
  return chars.length > MAX_NAME_CHARS ? chars.slice(0, MAX_NAME_CHARS).join('').trimEnd() : s
}

// ── Helpers de UI ──────────────────────────────────────────────
function showDisconnected() {
  if (sessionSoonActive) return
  document.getElementById('connectedTemplate').style.display    = 'none'
  document.getElementById('disconnectedTemplate').style.display = 'flex'
}
function showConnected() {
  document.getElementById('connectedTemplate').style.display    = 'flex'
  document.getElementById('disconnectedTemplate').style.display = 'none'
}
function showSessionEnded() {
  if (sessionSoonActive) return
  const el = document.getElementById('session-ended-overlay')
  el.style.display = 'flex'
}

// ── Normaliza data para ISO 8601 com fuso UTC ──────────────────
// Garante que strings do MySQL ("2026-04-07 21:00:00") sejam
// interpretadas corretamente em todos os browsers, incluindo Chromium/TV
function parseScheduledAt(raw) {
  if (!raw) return null
  if (/T.*[Z+\-]\d*$/.test(raw)) return new Date(raw)
  const iso = String(raw).replace(' ', 'T').replace(/(\.\d+)?$/, 'Z')
  const d = new Date(iso)
  return isNaN(d.getTime()) ? null : d
}

// ── Countdown para sessão em breve ─────────────────────────────
function showSessionSoon(sessionName, scheduledAtRaw) {
  sessionSoonActive = true
  document.getElementById('soon-session-name').textContent = sessionName

  const overlay = document.getElementById('session-soon-overlay')
  overlay.style.display = 'flex'

  const target = parseScheduledAt(scheduledAtRaw)

  if (countdownInterval) {
    clearInterval(countdownInterval)
    countdownInterval = null
  }

  function tick() {
    let diff = 0
    if (target && !isNaN(target.getTime())) {
      diff = Math.max(0, Math.floor((target.getTime() - Date.now()) / 1000))
    }
    const h = Math.floor(diff / 3600)
    const m = Math.floor((diff % 3600) / 60)
    const s = diff % 60
    document.getElementById('soon-countdown').textContent =
      `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`

    if (target && diff === 0) {
      clearInterval(countdownInterval)
      countdownInterval = null
      setTimeout(() => window.location.reload(), 2000)
    }
  }

  tick()
  countdownInterval = setInterval(tick, 1000)

  // Polling de 30s para detectar início da sessão — criado apenas uma vez
  if (!soonPollingStarted) {
    soonPollingStarted = true
    setInterval(async () => {
      try {
        const r = await fetch(`/api/monitor/${PAGE_TOKEN}`)
        const j = await r.json()
        if (j.ok && j.sessionStatus === 'active') window.location.reload()
      } catch {}
    }, 30_000)
  }
}

// ══════════════════════════════════════════════════════════════
// WebSocket (protocolo do ant-server: /ws/heartrate)
//   Servidor → cliente:
//     { type: 'initial_data', data: [AthleteRealtimeData] }
//     { type: 'heartrate',    data: AthleteRealtimeData }
//     { type: 'reset_all',    data: [AthleteRealtimeData] }
//     { type: 'pong' }
//   Cliente → servidor: { type: 'ping' | 'request_data' }
// ══════════════════════════════════════════════════════════════
let ws = null
let reconnectTimer = null
let pingInterval = null
let tokenPollingStarted = false

function connect() {
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null }

  const proto = window.location.protocol === 'https:' ? 'wss' : 'ws'
  const wsUrl = `${proto}://${window.location.hostname}:${ANT_PORT}/ws/heartrate`
  ws = new WebSocket(wsUrl)

  ws.onopen = () => {
    console.log('[WS] Conectado em', wsUrl)
    showConnected()
    if (!sessionStartTime) startSessionTimer()
    ws.send(JSON.stringify({ type: 'request_data' }))
    if (pingInterval) clearInterval(pingInterval)
    pingInterval = setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'ping' }))
    }, 25_000)
  }

  ws.onmessage = (event) => {
    try {
      handleWsMessage(JSON.parse(event.data))
    } catch (e) {
      console.error('[WS] Erro ao processar mensagem:', e)
    }
  }

  ws.onclose = () => {
    console.warn('[WS] Desconectado — tentando reconectar em 3s')
    if (pingInterval) { clearInterval(pingInterval); pingInterval = null }
    showDisconnected()
    if (!reconnectTimer) reconnectTimer = setTimeout(connect, 3000)
  }

  ws.onerror = (err) => {
    console.error('[WS] Erro:', err)
  }
}

function startTokenPolling() {
  if (tokenPollingStarted || sessionSoonActive) return
  tokenPollingStarted = true

  setInterval(async () => {
    if (sessionSoonActive) return
    try {
      const res  = await fetch(`/api/monitor/${PAGE_TOKEN}`)
      const json = await res.json()
      const ended = ['ended', 'cancelled', 'finished'].includes(json.sessionStatus)
      if (!res.ok || !json.ok || ended) {
        if (ws) { ws.onclose = null; ws.close() }
        showSessionEnded()
      }
    } catch {}
  }, 60_000)
}

// ══════════════════════════════════════════════════════════════
// Boot
// ══════════════════════════════════════════════════════════════
async function boot() {
  if (!PAGE_TOKEN) {
    document.getElementById('sessionNameHeader').textContent = 'TOKEN INVÁLIDO'
    showDisconnected()
    return
  }

  try {
    const res  = await fetch(`/api/monitor/${PAGE_TOKEN}`)
    const json = await res.json()

    if (!res.ok || !json.ok) {
      showSessionEnded()
      return
    }

    SESSION_ID   = json.sessionId
    SESSION_NAME = json.sessionName
    ANT_PORT     = json.antServerPort || '3001'

    document.getElementById('sessionNameHeader').textContent = SESSION_NAME
    document.title = `NODUS — ${SESSION_NAME}`

    if (json.sessionStatus === 'scheduled' || json.sessionStatus === 'pending') {
      showSessionSoon(SESSION_NAME, json.scheduledAt)
      return
    }

    if (['ended', 'cancelled', 'finished'].includes(json.sessionStatus)) {
      showSessionEnded()
      return
    }

    connect()
    startTokenPolling()
  } catch (err) {
    console.error('[Boot] Erro ao validar token:', err)
    showDisconnected()
  }
}

// ══════════════════════════════════════════════════════════════
// Estado e handlers de mensagens WS
// ══════════════════════════════════════════════════════════════
const athletes = new Map()   // athleteId -> estado do atleta

function handleWsMessage(msg) {
  switch (msg.type) {
    case 'initial_data':
    case 'reset_all':
      processBatch(Array.isArray(msg.data) ? msg.data : [])
      break
    case 'heartrate':
      processBatch(msg.data ? [msg.data] : [])
      break
    case 'session_ended':
      showSessionEnded()
      break
    case 'pong':
    default:
      break
  }
}

// Atualiza o estado local; retorna true se o atleta é novo na sessão
function upsertAthlete(a) {
  if (!a || a.athleteId == null) return false
  if (String(a.sessionId) !== String(SESSION_ID)) return false

  const now = Date.now()
  const prev = athletes.get(a.athleteId)
  const isNew = !prev
  let points = prev ? prev.points : 0

  if (prev && a.zone && a.heartRate > 0) {
    const dtMin = Math.min((now - prev.lastSeen) / 60000, 0.1)
    points += (ZONE_WEIGHT[a.zone] || 0) * dtMin
  }

  athletes.set(a.athleteId, {
    athleteId:    a.athleteId,
    name:         a.athleteName || '—',
    heartRate:    a.heartRate || 0,
    calories:     a.calories || 0,
    zone:         a.zone || 0,
    maxHeartRate: a.maxHeartRate || 190,
    points,
    lastSeen:     now,
  })
  return isNew
}

function processBatch(list) {
  let hasNew = false
  list.forEach(a => { if (upsertAthlete(a)) hasNew = true })

  if (hasNew) {
    buildGrid()
  } else {
    list.forEach(a => {
      const st = athletes.get(a.athleteId)
      if (st) updateCard(st)
    })
  }
}

// ══════════════════════════════════════════════════════════════
// Grid e Cards (CSS Grid: colunas e linhas fixas conforme o nº de atletas)
// ══════════════════════════════════════════════════════════════
function buildGrid() {
  const list = Array.from(athletes.values()).sort((x, y) => x.name.localeCompare(y.name, 'pt-BR'))
  const n = list.length
  if (n === 0) return

  const { colunas, linhas, gap, templateKey } = getGridConfig(n)
  const area   = document.getElementById('cardsArea')
  const header = document.getElementById('mainHeader')

  // A área dos cards ocupa exatamente o espaço abaixo do cabeçalho, sem rolagem
  const alturaArea = Math.max(0, window.innerHeight - header.offsetHeight)
  area.style.height              = `${alturaArea}px`
  area.style.padding             = `${gap}px`
  area.style.gap                 = `${gap}px`
  area.style.gridTemplateColumns = `repeat(${colunas}, minmax(0, 1fr))`
  area.style.gridTemplateRows    = `repeat(${linhas}, minmax(0, 1fr))`
  area.innerHTML = ''

  list.forEach(st => {
    const wrapper = document.createElement('div')
    wrapper.className = 'card-wrapper w3-card w3-round-large'
    wrapper.id        = `card-${st.athleteId}`
    wrapper.innerHTML = CARD_TEMPLATES[templateKey] || CARD_TEMPLATES['21_42']
    area.appendChild(wrapper)
    updateCard(st)
  })
}

function setText(card, selector, value) {
  card.querySelectorAll(selector).forEach(el => { el.textContent = value })
}

function updateCard(st) {
  const card = document.getElementById(`card-${st.athleteId}`)
  if (!card) return

  const pct = st.maxHeartRate > 0
    ? Math.max(0, Math.min(100, Math.round((st.heartRate / st.maxHeartRate) * 100)))
    : 0
  const kcal = Math.round(st.calories)

  setText(card, '[data-name]',      shortName(st.name))
  setText(card, '[data-hr]',        st.heartRate || '—')
  setText(card, '[data-calories]',  kcal)
  setText(card, '[data-calories2]', kcal)
  setText(card, '[data-points]',    Math.round(st.points))
  setText(card, '[data-percent]',   pct)

  const colorClass = ZONE_TO_COLOR_CLASS[st.zone] || 'w3-grey'
  card.style.backgroundColor = COLOR_MAPPING_OPACITY[colorClass]

  const dash = `${pct},100`
  const stroke = ZONE_STROKE[st.zone] || '#616161'
  card.querySelectorAll('.circle, .circle-progress').forEach(el => {
    el.setAttribute('stroke-dasharray', dash)
  })
  card.querySelectorAll('.circle-progress').forEach(el => {
    el.style.stroke = stroke
  })
}

// Recalcula a área dos cards ao redimensionar a janela
let resizeTimer = null
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer)
  resizeTimer = setTimeout(() => { if (athletes.size > 0) buildGrid() }, 250)
})

// ══════════════════════════════════════════════════════════════
// Timer de sessão
// ══════════════════════════════════════════════════════════════
function startSessionTimer(startedAt) {
  sessionStartTime = startedAt ? new Date(startedAt) : new Date()
  if (timerInterval) clearInterval(timerInterval)
  timerInterval = setInterval(() => {
    const elapsed = Math.max(0, Math.floor((Date.now() - sessionStartTime.getTime()) / 1000))
    const h = Math.floor(elapsed / 3600)
    const m = Math.floor((elapsed % 3600) / 60)
    const s = elapsed % 60
    document.getElementById('sessionTimer').textContent =
      `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
  }, 1000)
}

// ══════════════════════════════════════════════════════════════
boot()
</script>
